<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Mos e harro kush je</title>
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Cinzel"; font-weight: 500; src: url("assets/fonts/Cinzel-500.woff2") format("woff2"); }
      @font-face { font-family: "Cinzel"; font-weight: 700; src: url("assets/fonts/Cinzel-700.woff2") format("woff2"); }
      @font-face { font-family: "Cormorant"; font-weight: 500; font-style: italic; src: url("assets/fonts/Cormorant-500-italic.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 500; src: url("assets/fonts/Inter-500.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/Inter-600.woff2") format("woff2"); }

      :root {
        --black: #070506;
        --red: #b3161f;
        --red-deep: #5a0d12;
        --gold: #c9a45c;
        --gold-l: #ecd49c;
        --white: #f5efe4;
      }
      body { margin: 0; background: var(--black); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--black); }
      .clip { position: absolute; inset: 0; overflow: hidden; }

      /* ---------- SLIDES : the eight AI stills (ElevenLabs, Seedream 5 Pro, 1152 x 2048) ---------- */
      #slides { background: var(--black); }
      .slide { position: absolute; left: -36px; top: -64px; width: 1152px; height: 2048px; opacity: 0; will-change: transform, opacity, filter; }
      .slide img { display: block; width: 1152px; height: 2048px; }
      #grade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(40,14,8,.28) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 58%, rgba(7,5,6,.78) 86%, rgba(7,5,6,.9) 100%); pointer-events: none; }
      #leak { position: absolute; left: -500px; top: -300px; width: 1400px; height: 1400px; border-radius: 50%; background: radial-gradient(circle, rgba(255,196,120,.85) 0%, rgba(230,110,50,.45) 35%, rgba(179,22,31,0) 70%); mix-blend-mode: screen; opacity: 0; filter: blur(20px); }
      #blackout { position: absolute; inset: 0; background: var(--black); opacity: 1; }

      /* ---------- S5 FINAL ---------- */
      .eagle { position: absolute; -webkit-mask-image: url("assets/img/eagle-white.png"); mask-image: url("assets/img/eagle-white.png"); -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
      #s5-glow { position: absolute; left: -260px; top: 120px; width: 1600px; height: 1300px; background: radial-gradient(ellipse 45% 42% at 50% 45%, rgba(179,22,31,.55) 0%, rgba(90,13,18,.35) 40%, rgba(7,5,6,0) 72%); }
      #s5-eagle { left: 285px; top: 330px; width: 510px; height: 567px; background: linear-gradient(170deg, #e2343d 0%, #b3161f 45%, #6d0d13 100%); filter: drop-shadow(0 0 40px rgba(220,40,50,.45)); }
      #s5-sheen { left: 285px; top: 330px; width: 510px; height: 567px; background: linear-gradient(105deg, rgba(255,230,170,0) 35%, rgba(255,230,170,.85) 50%, rgba(255,230,170,0) 65%); background-size: 300% 100%; background-position: 100% 0; mix-blend-mode: screen; }
      #s5-title { position: absolute; left: 0; top: 1000px; width: 1080px; text-align: center; font: 700 92px/1.12 "Cinzel", serif; color: var(--white); letter-spacing: .07em; }
      #s5-title .ln { display: block; }
      #s5-title span { display: inline-block; }
      #s5-rule { position: absolute; left: 430px; top: 1252px; width: 220px; height: 2px; background: linear-gradient(90deg, rgba(201,164,92,0), var(--gold), rgba(201,164,92,0)); }
      #s5-logo { position: absolute; left: 470px; top: 1290px; width: 140px; height: 140px; clip-path: circle(48.5%); }

      /* ---------- global overlays ---------- */
      #dust .mote { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,233,190,.95), rgba(255,200,120,0) 70%); }
      #grain { position: absolute; inset: -64px; opacity: .085; mix-blend-mode: overlay; pointer-events: none; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 60% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.72) 100%); pointer-events: none; }
      #subs { position: absolute; left: 110px; top: 1395px; width: 860px; height: 130px; }
      .chunk { position: absolute; left: 0; top: 0; width: 860px; text-align: center; font: 600 50px/1.25 "Inter", sans-serif; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9); }
      .chunk .w { display: inline-block; position: relative; margin: 0 .12em; }
      .chunk .k { color: var(--gold-l); }
      .chunk .stroke { position: absolute; left: 0; bottom: -6px; width: 100%; height: 4px; border-radius: 2px; background: var(--red); transform-origin: left center; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="30" data-fps="30">
      <!-- SLIDES 0-24.85: eight stills, Ken Burns, cross-dissolves, light leaks -->
      <section id="slides" class="clip" data-start="0" data-duration="24.85" data-track-index="1">
        <div id="slide-stack" class="full"></div>
        <div id="leak"></div>
        <div id="grade"></div>
        <div id="blackout"></div>
      </section>

      <!-- S5 MESAZHI FINAL 24.8-30 -->
      <section id="s5" class="clip" data-start="24.8" data-duration="5.2" data-track-index="5">
        <div id="s5-wrap" class="wrap">
          <div id="s5-cam" class="cam">
            <div id="s5-glow"></div>
            <div id="s5-eagle" class="eagle"></div>
            <div id="s5-sheen" class="eagle"></div>
            <div id="s5-title"><span class="ln"><span>MOS</span> <span>E</span> <span>HARRO</span></span><span class="ln"><span>KUSH</span> <span>JE.</span></span></div>
            <div id="s5-rule"></div>
            <img id="s5-logo" src="assets/img/logo.png" alt="Balli Kombëtar për Rininë e Diasporës" />
          </div>
        </div>
      </section>

      <div id="dust" class="full"></div>
      <div id="vignette"></div>
      <div id="grain"></div>
      <div id="subs"></div>

      <audio id="score" src="assets/music/score.wav" data-start="0" data-duration="30" data-volume="0.5" data-track-index="8"></audio>
      <audio id="voix" src="assets/audio/voix-montage.wav" data-start="0" data-duration="30" data-track-index="9"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // ---------------------------------------------------------------- helpers
      function rng(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const $ = (s) => document.querySelector(s);

      // ---------------------------------------------------------------- slides
      // One still per idea of the voice. t0: the dissolve in starts; t1: the slide is gone (the next one covers it).
      // o: focus point of the Ken Burns (transform-origin, % of the still); s, x, y: scale and drift from -> to.
      // A slide whose `stand` is set shows a reframed detail of a still already generated, until its own still exists
      // (the ElevenLabs free plan stopped after three stills on 2026-10-21): delete `stand` once the file is in assets/img/ia/.
      const XF = 0.7;
      const SLIDES = [
        { src: "01-fenetre.jpg", t0: 0.0, t1: 3.3, o: "50% 30%", s: [1.0, 1.14], x: [0, 0], y: [30, -10] },
        { src: "02-photo.jpg", t0: 2.6, t1: 5.9, o: "50% 31%", s: [1.32, 1.08], x: [-20, 10], y: [0, 0] },
        { src: "03-kulla.jpg", t0: 5.2, t1: 7.7, o: "62% 20%", s: [1.05, 1.2], x: [30, -20], y: [0, 0] },
        { src: "04-gjyshja.jpg", t0: 7.0, t1: 11.9, o: "50% 40%", s: [1.2, 1.04], x: [0, 0], y: [-30, 20],
          stand: { src: "02-photo.jpg", o: "46% 26%", s: [1.9, 2.25], x: [20, -20], y: [0, 0] } },
        { src: "05-qyteti.jpg", t0: 11.2, t1: 14.4, o: "50% 35%", s: [1.18, 1.04], x: [40, -40], y: [0, 0],
          stand: { src: "03-kulla.jpg", o: "96% 22%", s: [1.75, 1.35], x: [-30, 0], y: [0, 0] } },
        { src: "06-fletorja.jpg", t0: 13.7, t1: 18.9, o: "50% 38%", s: [1.04, 1.22], x: [0, 0], y: [20, -20],
          stand: { src: "01-fenetre.jpg", o: "50% 30%", s: [1.75, 2.05], x: [0, 0], y: [0, 0] } },
        { src: "07-brezat.jpg", t0: 18.2, t1: 21.9, o: "50% 45%", s: [1.22, 1.05], x: [0, 0], y: [40, 0],
          stand: { src: "03-kulla.jpg", o: "70% 88%", s: [1.35, 1.1], x: [0, 0], y: [40, -20] } },
        { src: "08-alpet.jpg", t0: 21.2, t1: 24.85, o: "50% 30%", s: [1.04, 1.24], x: [0, 0], y: [0, -40],
          stand: { src: "01-fenetre.jpg", o: "50% 27%", s: [2.1, 3.1], x: [0, 0], y: [0, 0] } },
      ];
      (function () {
        $("#slide-stack").innerHTML = SLIDES.map((sl, i) => `<div class="slide" id="sl${i}"><img src="assets/img/ia/${(sl.stand || sl).src}" alt="" /></div>`).join("");
      })();

      // ---------------------------------------------------------------- dust + grain
      (function () {
        const r = rng(3), d = $("#dust");
        let h = "";
        for (let i = 0; i < 64; i++) { const s = 3 + r() * 9; h += `<div class="mote" style="left:${(r() * 1080).toFixed(0)}px;top:${(r() * 1920).toFixed(0)}px;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;opacity:${(0.15 + r() * 0.5).toFixed(2)};filter:blur(${(r() * 2.5).toFixed(1)}px)"></div>`; }
        d.innerHTML = h;
        const c = document.createElement("canvas"); c.width = c.height = 256;
        const x = c.getContext("2d"), im = x.createImageData(256, 256), rr = rng(42);
        for (let i = 0; i < im.data.length; i += 4) { const v = rr() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
        x.putImageData(im, 0, 0);
        $("#grain").style.backgroundImage = `url(${c.toDataURL()})`;
      })();

      // ---------------------------------------------------------------- subtitles (word timings from build-voice.py -> cues.json)
      const CUES = [
        {key: "kurrë", words: [["Ka", 0.8], ["vende", 1.01], ["që", 1.36], ["i", 1.56], ["lamë", 1.77], ["mbrapa…", 2.12]], end: 2.92},
        {key: "kurrë", words: [["por", 2.99], ["që", 3.12], ["kurrë", 3.39], ["nuk", 3.7], ["na", 3.89], ["lanë", 4.07], ["neve.", 4.39]], end: 5.15},
        {key: "gjyshërve,", words: [["Në", 5.8], ["zânin", 6.01], ["e", 6.36], ["gjyshërve,", 6.57]], end: 7.22},
        {key: "nanës,", words: [["në", 7.27], ["fjalët", 7.49], ["e", 7.86], ["nanës,", 8.08]], end: 8.57},
        {key: "kujtesa", words: [["jeton", 8.62], ["kujtesa", 8.98], ["jonë.", 9.5]], end: 10.31},
        {key: "larg,", words: [["Edhe", 12.36], ["kur", 12.71], ["jeta", 12.92], ["na", 13.27], ["çon", 13.47], ["larg,", 13.68]], end: 14.15},
        {key: "gjuha", words: [["gjuha", 14.2], ["na", 14.57], ["e", 14.79], ["kujton", 15.01], ["prej", 15.39], ["kah", 15.61], ["vijmë.", 15.82]], end: 16.65},
        {key: "trashëgimia", words: [["Sepse", 18.6], ["trashëgimia", 18.92], ["nuk", 19.63], ["asht", 19.81], ["veç", 20.0], ["ajo", 20.18], ["që", 20.5], ["marrim…", 20.68]], end: 21.41},
        {key: "brezave.", words: [["asht", 21.46], ["edhe", 21.65], ["ajo", 21.96], ["që", 22.28], ["ua", 22.47], ["lamë", 22.78], ["brezave.", 23.1]], end: 24.0},
        {key: "", words: [["Mos", 26.6], ["e", 26.79], ["harro", 26.98], ["kush", 27.31], ["je.", 27.5]], end: 28.14},
      ];
      (function () {
        $("#subs").innerHTML = CUES.map((c, i) => `<div class="chunk" id="c${i}">${c.words.map(([w]) => `<span class="w${w === c.key ? " k" : ""}">${w}${w === c.key ? '<i class="stroke"></i>' : ""}</span>`).join(" ")}</div>`).join("");
      })();
      (function () {
        $("#subs").innerHTML = CUES.map((c, i) => `<div class="chunk" id="c${i}">${c.words.map(([w]) => `<span class="w${w === c.key ? " k" : ""}">${w}${w === c.key ? '<i class="stroke"></i>' : ""}</span>`).join(" ")}</div>`).join("");
      })();

      // ---------------------------------------------------------------- timeline
      const tl = gsap.timeline({ paused: true });

      // global: dust drifts up through the whole film, grain flickers
      document.querySelectorAll("#dust .mote").forEach((m, i) => {
        const r = rng(500 + i);
        tl.fromTo(m, { y: 0, x: 0 }, { y: -(120 + r() * 260), x: (r() - 0.5) * 140, duration: 30, ease: "none" }, 0);
      });
      tl.fromTo("#grain", { x: 0, y: 0 }, { x: 64, y: 48, duration: 30, ease: "steps(240)" }, 0);
      tl.fromTo("#dust", { opacity: 0 }, { opacity: 1, duration: 2.5, ease: "sine.inOut" }, 0.3);

      // SLIDES ----------------------------------------------------------------
      tl.fromTo("#blackout", { opacity: 1 }, { opacity: 0, duration: 1.4, ease: "sine.inOut" }, 0);
      SLIDES.forEach((sl, i) => {
        const m = sl.stand || sl, el = "#sl" + i, d = sl.t1 - sl.t0, first = i === 0;
        // the camera never stops: one slow move over the whole life of the slide
        tl.fromTo(el, { scale: m.s[0], x: m.x[0], y: m.y[0], rotation: i % 2 ? -0.6 : 0.6, transformOrigin: m.o },
          { scale: m.s[1], x: m.x[1], y: m.y[1], rotation: 0, duration: d, ease: "sine.inOut" }, sl.t0);
        // dissolve in from a soft, over-exposed blur, the previous still stays under it
        tl.fromTo(el, { opacity: first ? 1 : 0, filter: first ? "blur(0px) brightness(1)" : "blur(14px) brightness(1.35)" },
          { opacity: 1, filter: "blur(0px) brightness(1)", duration: first ? 0.01 : XF, ease: "power2.out" }, sl.t0);
        // a warm light leak sweeps across every dissolve
        if (!first) {
          const r = rng(70 + i), fromLeft = i % 2 === 1;
          tl.fromTo("#leak", { x: fromLeft ? -300 : 700, y: (r() - 0.5) * 900, opacity: 0, scale: 0.8 },
            { x: fromLeft ? 700 : -300, y: (r() - 0.5) * 900, opacity: 0.55, scale: 1.15, duration: XF, ease: "sine.in" }, sl.t0 - 0.15);
          tl.to("#leak", { opacity: 0, duration: 0.6, ease: "sine.out" }, sl.t0 - 0.15 + XF);
        }
      });
      // climax: the last still burns brighter until the hard cut to black at 24.85 (the music stops dead there)
      tl.to("#sl7", { filter: "blur(0px) brightness(1.3) saturate(1.15)", duration: 1.8, ease: "sine.in" }, 23.0);
      tl.fromTo("#leak", { x: 200, y: -200, opacity: 0, scale: 0.9 }, { opacity: 0.6, scale: 1.3, duration: 1.8, ease: "sine.in" }, 23.0);

      // S5 MESAZHI FINAL ------------------------------------------------------
      tl.fromTo("#s5-wrap", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 24.8);
      tl.fromTo("#s5-cam", { scale: 1.06, transformOrigin: "540px 800px" }, { scale: 1.0, duration: 5.2, ease: "power1.out" }, 24.8);
      tl.fromTo("#s5-glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 2.2, ease: "sine.out" }, 25.3);
      tl.fromTo("#s5-eagle", { clipPath: "inset(0% 50% 0% 50%)", opacity: 0, y: 24 }, { clipPath: "inset(0% 0% 0% 0%)", opacity: 1, y: 0, duration: 1.7, ease: "power2.inOut" }, 25.6);
      tl.fromTo("#s5-sheen", { backgroundPosition: "100% 0", opacity: 1 }, { backgroundPosition: "0% 0", duration: 1.4, ease: "sine.inOut" }, 27.0);
      document.querySelectorAll("#s5-title span span").forEach((sp, i) => {
        tl.fromTo(sp, { opacity: 0, y: 34, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 28.15 + i * 0.13);
      });
      tl.fromTo("#s5-rule", { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 28.75);
      tl.fromTo("#s5-logo", { opacity: 0, scale: 0.9 }, { opacity: 0.95, scale: 1, duration: 0.8, ease: "power2.out" }, 28.9);
      tl.to("#dust", { opacity: 0.5, duration: 1, ease: "sine.inOut" }, 25);

      // subtitles ---------------------------------------------------------------
      CUES.forEach((c, i) => {
        const el = document.getElementById("c" + i), ws = el.querySelectorAll(".w");
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, c.words[0][1] - 0.02);
        ws.forEach((w, j) => {
          tl.fromTo(w, { opacity: 0, y: 14, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.32, ease: "power2.out" }, c.words[j][1]);
          const st = w.querySelector(".stroke");
          if (st) tl.fromTo(st, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, c.words[j][1] + 0.18);
        });
        tl.to(el, { opacity: 0, duration: 0.25, ease: "sine.in" }, c.end - 0.25);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
