    <script>
      window.__timelines = window.__timelines || {};
      const $ = (s) => document.querySelector(s);
      // variables: from the HyperFrames runtime, else the defaults declared on <html> (plain browser preview)
      const VARS = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) ||
        Object.fromEntries(JSON.parse(document.documentElement.dataset.compositionVariables || "[]").map((v) => [v.id, v.default]));
      const SUBTITLES = VARS.subtitles !== false;
      const ANIMATE = VARS.animate !== false;     // false: stills stay stills (only the camera moves), for A/B checks

      // ================================================================ SHOTS (all times in film seconds)
      // img: 0 window, 1 family photograph, 2 kulla, 3 old town at dusk, 4 notebook and candle, 5 Alps at sunset.
      // Rule of the film: every still is used by ONE shot only, never seen again once its shot has ended. Keyframes: t, cx/cy (centre of the frame on the still, 0..1),
      // z (zoom, 1 = the still fills the frame), px/py (camera translation: parallax by depth), k (dolly: near planes
      // grow faster than far ones), f (depth that stays still), ex (exposure), ry (light-ray strength), lx/ly (light
      // source on screen). Each keyframe also names the ease INTO it. Shots overlap during their transition.
      const SHOTS = [
        { id: "A-fenetre", img: 0, t0: 0.0, t1: 6.05, keys: [
          { t: 0.0, cx: 0.52, cy: 0.47, z: 1.06, px: -0.016, py: 0, k: 0, f: 0.6, ex: 0.82, ry: 0.65, lx: 0.53, ly: 0.43 },
          { t: 0.7, ex: 1.0, ease: "sine.out" },
          { t: 3.1, cx: 0.535, cy: 0.445, z: 1.42, px: 0.004, k: 0.12, ry: 0.75, ease: "sine.inOut" },
          { t: 6.05, cx: 0.54, cy: 0.43, z: 2.05, px: 0.014, k: 0.28, ex: 1.12, ry: 0.95, lx: 0.54, ly: 0.42, ease: "power2.in" } ] },
        { id: "C-photo", img: 1, t0: 5.45, t1: 11.75, keys: [
          { t: 5.45, cx: 0.53, cy: 0.49, z: 1.16, px: 0.010, py: -0.004, k: 0.05, f: 0.86, ex: 1.05, ry: 0.45, lx: 0.95, ly: 0.04 },
          { t: 7.25, cx: 0.605, cy: 0.445, z: 1.72, px: 0.004, k: 0.02, ex: 1.0, ease: "power2.out" },
          { t: 9.05, cx: 0.39, cy: 0.455, z: 2.12, px: -0.004, ry: 0.55, lx: 0.75, ly: 0.02, ease: "sine.inOut" },
          { t: 11.75, cx: 0.45, cy: 0.49, z: 2.26, px: -0.008, ex: 1.12, ry: 0.70, lx: 0.55, ly: 0.0, ease: "sine.inOut" } ] },
        { id: "E-qyteti", img: 3, t0: 10.95, t1: 14.35, keys: [
          { t: 10.95, cx: 0.40, cy: 0.63, z: 1.55, px: 0.006, py: 0.004, k: -0.08, f: 0.6, ex: 1.0, ry: 0.15, lx: 0.92, ly: 0.30 },
          { t: 14.35, cx: 0.45, cy: 0.44, z: 1.14, px: -0.006, py: -0.002, k: -0.02, ry: 0.25, lx: 0.95, ly: 0.34, ease: "sine.inOut" } ] },
        { id: "F-fletorja", img: 4, t0: 13.95, t1: 17.15, keys: [
          { t: 13.95, cx: 0.42, cy: 0.58, z: 1.75, px: 0.006, py: 0.004, k: 0.04, f: 0.7, ex: 1.0, ry: 0.35, lx: 0.48, ly: -0.10 },
          { t: 15.6, cx: 0.47, cy: 0.42, z: 1.88, px: 0.0, py: -0.002, ry: 0.45, lx: 0.48, ly: 0.0, ease: "sine.inOut" },
          { t: 17.15, cx: 0.46, cy: 0.21, z: 1.66, px: -0.006, py: -0.006, k: 0.10, ex: 1.12, ry: 0.85, lx: 0.50, ly: 0.30, ease: "sine.inOut" } ] },
        { id: "G-kulla", img: 2, t0: 16.55, t1: 21.95, keys: [
          { t: 16.55, cx: 0.37, cy: 0.305, z: 2.15, px: 0.004, py: 0, k: -0.06, f: 0.42, ex: 0.96, ry: 0.30, lx: 0.98, ly: 0.12 },
          { t: 19.0, cx: 0.45, cy: 0.40, z: 1.52, px: -0.004, k: -0.04, ex: 1.0, ease: "sine.out" },
          { t: 21.95, cx: 0.52, cy: 0.62, z: 1.30, px: -0.008, py: 0.004, k: -0.02, f: 0.55, ry: 0.25, ease: "sine.inOut" } ] },
        { id: "H-alpet", img: 5, eagle: true, t0: 21.35, t1: 30.0, keys: [
          { t: 21.35, cx: 0.50, cy: 0.62, z: 1.30, px: 0.0, py: 0.006, k: 0.0, f: 0.4, ex: 1.0, ry: 0.35, lx: 0.60, ly: -0.15 },
          { t: 24.85, cx: 0.53, cy: 0.26, z: 1.55, px: 0.006, py: -0.008, k: 0.10, ex: 1.22, ry: 1.0, lx: 0.65, ly: 0.42, ease: "sine.inOut" },
          { t: 25.35, z: 1.58, ex: 0.16, ry: 0.15, sat: 0.55, ease: "sine.out" },
          { t: 30.0, z: 1.70, ex: 0.13, px: 0.010, ry: 0.10, ease: "none" } ] },
      ];
      // transitions: shot a -> shot b over [t0, t1]; "light" opens on the highlights of b, "dissolve" is a plain mix
      const CUTS = [
        { a: 0, b: 1, t0: 5.45, t1: 6.05, type: "light" },
        { a: 1, b: 2, t0: 10.95, t1: 11.75, type: "light" },
        { a: 2, b: 3, t0: 13.95, t1: 14.35, type: "dissolve" },
        { a: 3, b: 4, t0: 16.55, t1: 17.15, type: "light" },
        { a: 4, b: 5, t0: 21.35, t1: 21.95, type: "dissolve" },
      ];

      // ================================================================ ANIM: the life of each still (V7)
      // Where a still may move comes from its animation map (build-anim.py): R drift, G water or grass, B flame/lamp/windows.
      // How much, here, per shot. Everything stays below what the eye reads as an effect: a few pixels of travel, a few
      // per cent of light. Units are still uv (1 = the width of the still) and seconds.
      //   drift   amp (warp), speed (field travel / s), wisps (opacity of the drifting mist)
      //   water   amp, speed, sparkle (glints of the street lights)          windows  span over which some come on
      //   flicker amount, at (x, y) with radius r; sway (flame), haze (air above it)
      //   breeze  amp (grass)          dust  amount (motes lit by the beams)          sweep  sunlight across the print
      //   dof     [blur radius per unit of depth, focus depth] (shallow depth of field from the depth map)
      const ANIM = {
        "A-fenetre": { drift: [0.006, 0.08, 0.35], dust: 1.0 },
        "C-photo": { dust: 0.8, sweep: 0.12 },
        "E-qyteti": { water: [0.0035, 0.35, 0.3], windows: 2.2 },
        "F-fletorja": { flicker: [0.12, 0.461, 0.128, 0.45], sway: 0.006, haze: 0.0025, dof: [0.013, 0.92] },
        "G-kulla": { drift: [0.004, 0.05, 0.25], flicker: [0.35, 0.36, 0.306, 0.012], breeze: 0.0022 },
        "H-alpet": { drift: [0.005, 0.06, 0.3] },
      };
      function animOf(s) {
        const a = (ANIMATE && ANIM[s.id]) || {}, d = a.drift || [0, 0, 0], w = a.water || [0, 0, 0], f = a.flicker || [0, 0, 0, 0];
        return new Float32Array([
          d[0], d[1], d[2], 0,
          w[0], w[1], w[2], a.windows || 0,
          f[0], a.sway || 0, a.haze || 0, a.breeze || 0,
          f[1], f[2], f[3], a.dust || 0,
          a.sweep || 0, s.t0, (a.dof || [0, 0])[0], (a.dof || [0, 0])[1]]);
      }
      // the eagle of the panorama (sprite cut out by build-anim.py, 150 x 97 px, half width 0.0651 of the still) glides
      // from the left of the sky to the exact place where it was photographed, which is where the emblem of the
      // signature appears; it banks gently and grows a little as it comes closer
      const EAGLE = [
        { t: 21.35, x: 0.37, y: 0.214, hw: 0.050, a: -0.11 },
        { t: 24.85, x: 0.5339, y: 0.1726, hw: 0.0651, a: 0.0 },
        { t: 25.6, x: 0.546, y: 0.168, hw: 0.067, a: 0.02 },
      ];
      function eagleAt(s, t) {
        if (!ANIMATE) return [EAGLE[1].x, EAGLE[1].y, EAGLE[1].hw, 0];
        const k = EAGLE;
        let i = 1;
        while (i < k.length - 1 && t > k[i].t) i++;
        const a = k[i - 1], b = k[i], u = Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))), e = i === 1 ? -(Math.cos(Math.PI * u) - 1) / 2 : u;
        const L = (p) => a[p] + (b[p] - a[p]) * e;
        return [L("x"), L("y"), L("hw"), L("a") + 0.03 * Math.sin(t * 0.9)];
      }

      // ================================================================ easing + keyframe evaluation (deterministic)
      const EASE = {
        none: (x) => x,
        "sine.in": (x) => 1 - Math.cos((x * Math.PI) / 2),
        "sine.out": (x) => Math.sin((x * Math.PI) / 2),
        "sine.inOut": (x) => -(Math.cos(Math.PI * x) - 1) / 2,
        "power2.in": (x) => x * x,
        "power2.out": (x) => 1 - (1 - x) * (1 - x),
        "power2.inOut": (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2),
      };
      const PROPS = ["cx", "cy", "z", "px", "py", "k", "f", "ex", "ry", "lx", "ly", "sat"];
      SHOTS.forEach((s) => {
        let prev = { sat: 1 };
        s.keys = s.keys.map((k) => (prev = Object.assign({}, prev, k)));
      });
      function camAt(s, t) {
        const ks = s.keys;
        if (t <= ks[0].t) return ks[0];
        for (let i = 1; i < ks.length; i++) {
          if (t <= ks[i].t) {
            const a = ks[i - 1], b = ks[i], e = EASE[b.ease || "sine.inOut"]((t - a.t) / (b.t - a.t)), o = {};
            PROPS.forEach((p) => (o[p] = a[p] + (b[p] - a[p]) * e));
            return clampCam(o);
          }
        }
        return clampCam(ks[ks.length - 1]);
      }
      // keep the frame (plus parallax margin) inside the still
      function clampCam(c) {
        const o = Object.assign({}, c), h = 0.5 / o.z, m = 0.012 + Math.abs(o.px) + Math.abs(o.py);
        o.cx = Math.min(1 - h - m, Math.max(h + m, o.cx));
        o.cy = Math.min(1 - h - m, Math.max(h + m, o.cy));
        return o;
      }

      // ================================================================ WebGL2 renderer
      const canvas = $("#film");
      const gl = canvas.getContext("webgl2", { alpha: false, antialias: false, preserveDrawingBuffer: true });
      const VS = `#version 300 es
        in vec2 p; out vec2 uv;
        void main() { uv = vec2(p.x * 0.5 + 0.5, 0.5 - p.y * 0.5); gl_Position = vec4(p, 0.0, 1.0); }`;
      const FS = `#version 300 es
        precision highp float;
        in vec2 uv; out vec4 o;
        uniform sampler2D imA, dpA, anA, imB, dpB, anB, bird;
        uniform vec4 camA, camB;      // cx, cy, zoom, dolly
        uniform vec4 offA, offB;      // px, py, focus depth, exposure
        uniform vec4 litA, litB;      // light x, y, ray strength, saturation
        uniform vec4 aA[5], aB[5];    // life of the still, see ANIM in the script
        uniform vec4 birdA, birdB;    // eagle: centre (still uv), half width (still uv, 0 = none), bank angle
        uniform float mixAB, lightCut, frame, time, life;
        const float ASPECT = 1.7778;  // height / width of the stills and of the frame
        float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
        float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
        float vnoise(vec2 p) {
          vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
        }
        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 4; i++) { v += a * vnoise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; }
          return v;
        }
        vec2 parallax(sampler2D dp, vec4 cam, vec4 off, vec2 uv) {
          vec2 p = cam.xy + (uv - 0.5) / cam.z, q = p;
          for (int i = 0; i < 5; i++) {
            float d = texture(dp, q).r - off.z;
            q = p - off.xy * d - (p - cam.xy) * cam.w * d;
          }
          return q;
        }
        // dust in the air: two layers of motes (near and out of focus, far and sharp), lit only where the light is
        float dust(vec4 cam) {
          float acc = 0.0;
          for (int L = 0; L < 2; L++) {
            float fl = float(L), cells = mix(11.0, 24.0, fl);
            vec2 p = cam.xy + (uv - 0.5) / (cam.z * mix(0.85, 1.0, fl));
            p = p * vec2(cells, cells * ASPECT) + vec2(time * mix(0.06, 0.035, fl), -time * mix(0.16, 0.09, fl));
            vec2 id = floor(p), f = fract(p);
            float h = hash(id + fl * 17.0);
            if (h > 0.5) {
              vec2 pos = vec2(hash(id + 3.1), hash(id + 7.7)) * 0.56 + 0.22 + 0.1 * vec2(sin(time * 0.6 + h * 20.0), cos(time * 0.45 + h * 13.0));
              float r = mix(0.075, 0.05, fl) * (0.6 + 0.8 * hash(id + 1.9));
              float soft = mix(0.75, 0.3, fl);
              float m = 1.0 - smoothstep(r * (1.0 - soft), r, length(f - pos));
              acc += m * (0.6 + 0.4 * sin(time * (0.8 + 2.5 * h) + h * 40.0)) * mix(0.35, 0.6, fl);
            }
          }
          return acc;
        }
        vec3 shot(sampler2D im, sampler2D dp, sampler2D an, vec4 cam, vec4 off, vec4 lit, vec4 P[5], vec4 eagle) {
          vec2 q = parallax(dp, cam, off, uv);
          vec3 m = texture(an, q).rgb;
          // mist, haze and clouds: the still is gently warped by a slowly travelling noise field
          if (P[0].x > 0.0 && m.r > 0.004) {
            vec2 fp = q * vec2(3.0, 5.0) + vec2(time * P[0].y, time * P[0].y * 0.3);
            q += m.r * P[0].x * (vec2(fbm(fp), fbm(fp + vec2(5.2, 1.3))) - 0.5);
          }
